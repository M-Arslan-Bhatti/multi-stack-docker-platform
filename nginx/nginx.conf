# Server block 1: Site 1 on port 81
server {
    listen 81;
    server_name site1.local localhost;

    root /usr/share/nginx/html/site1;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Server block 2: Site 2 on port 82
server {
    listen 82;
    server_name site2.local localhost;

    root /usr/share/nginx/html/site2;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
